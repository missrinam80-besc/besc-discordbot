name: Bot checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: docker build --tag besc-discordbot:ci .
      - name: Check image contents and runtime user without credentials
        run: |
          docker run --rm --entrypoint node besc-discordbot:ci -e "const fs=require('node:fs'); if(process.getuid()===0 || fs.existsSync('/app/.env') || fs.existsSync('/app/tests') || fs.existsSync('/app/src') || !fs.existsSync('/app/dist/main.js')) process.exit(1)"
          docker run --rm --read-only --mount type=volume,destination=/app/state --entrypoint node besc-discordbot:ci -e "const fs=require('node:fs'); fs.writeFileSync('/app/state/ci-probe','ok'); fs.unlinkSync('/app/state/ci-probe'); if(process.getuid()===0) process.exit(1)"
          docker compose config --quiet
        env:
          BESC_BOT_IMAGE: besc-discordbot:ci
          BESC_BOT_ENV_FILE: .env.example
      - name: Check durable slot journal across non-root read-only containers
        run: |
          docker run --rm --read-only --mount type=volume,source=besc-slot-state-ci,target=/app/state --entrypoint node besc-discordbot:ci --input-type=module -e "import {FileSlotState} from './dist/slot-state.js'; const s=new FileSlotState('/app/state',{apiUrl:'https://fixture.invalid/api/v1/bot/',guildId:'100000000000000001',applicationId:'500000000000000001',clientId:'TESTFIXTURE'}); s.write({id:'30000000-0000-4000-8000-000000000001',lease_token:'40000000-0000-4000-8000-000000000001',lease_until:'2099-10-14T10:02:00Z',phase:'sent',messageId:'300000000000000001'}); s.close();"
          docker run --rm --read-only --mount type=volume,source=besc-slot-state-ci,target=/app/state --entrypoint node besc-discordbot:ci --input-type=module -e "import {FileSlotState} from './dist/slot-state.js'; const s=new FileSlotState('/app/state',{apiUrl:'https://fixture.invalid/api/v1/bot/',guildId:'100000000000000001',applicationId:'500000000000000001',clientId:'TESTFIXTURE'}); if(s.read()?.messageId!=='300000000000000001') process.exit(1); s.close();"
      - name: Check durable rewards journal across non-root read-only containers
        run: |
          docker run --rm --read-only --mount type=volume,source=besc-rewards-state-ci,target=/app/state --entrypoint node besc-discordbot:ci --input-type=module -e "import {FileRewardState} from './dist/rewards-state.js'; const s=new FileRewardState('/app/state',{apiUrl:'https://fixture.invalid/api/v1/bot/',guildId:'100000000000000001',applicationId:'500000000000000001',clientId:'TESTFIXTURE'}); s.enqueue({id:'300000000000000001',actor:'100000000000000002',operation:'request',data:{reward_id:'30000000-0000-4000-8000-000000000001',version:1}},Date.now()); s.close();"
          docker run --rm --read-only --mount type=volume,source=besc-rewards-state-ci,target=/app/state --entrypoint node besc-discordbot:ci --input-type=module -e "import {FileRewardState} from './dist/rewards-state.js'; const s=new FileRewardState('/app/state',{apiUrl:'https://fixture.invalid/api/v1/bot/',guildId:'100000000000000001',applicationId:'500000000000000001',clientId:'TESTFIXTURE'}); const r=s.read('request','300000000000000001'); if(r?.phase!=='pending'||r.data.version!==1||r.attempts!==0) process.exit(1); s.close();"
